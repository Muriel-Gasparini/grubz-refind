# VM ONLY. These loaders are demonstration programs, not installed OSes.
timeout 0
screensaver 0
inactive_icon_brightness 32
selection_animation_ms 120
use_nvram false
scanfor manual
default_selection Debian
resolution 1600 900
banner theme/background.png
banner_scale fillscreen
icons_dir theme
big_icon_size 384
small_icon_size 48
selection_big theme/selection.png
hideui label,hints,arrows,badges
showtools

menuentry "Debian" {
    loader /EFI/DEBIAN/test.efi
    icon /EFI/BOOT/theme/debian.png
}

menuentry "Windows" {
    loader /EFI/WINDOWS/test.efi
    icon /EFI/BOOT/theme/windows.png
}
